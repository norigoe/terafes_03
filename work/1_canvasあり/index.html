<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ゆめかわ★ウイルス・ぽっぷ</title>
<style>
:root{--pk:#ff8fc7;--bl:#4fd8ff;--ink:#5a3a7a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#2b1f4a;font-family:"Hiragino Maru Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;color:var(--ink)}
body{display:grid;place-items:center}
#app{position:relative;width:min(100vw,calc(100vh*4/3));aspect-ratio:4/3;font-size:min(2.2vw,2.93vh)}
canvas{width:100%;height:100%;display:block;border-radius:1em}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:.6em;text-align:center;border-radius:1em;background:linear-gradient(160deg,#ffe0f3,#e3d6ff 55%,#c9f1ff)}
.scr.on{display:flex}
h1{margin:0;font-size:2.7em;line-height:1.1;color:#fff;-webkit-text-stroke:.05em var(--pk);paint-order:stroke fill;text-shadow:.07em .07em 0 var(--bl)}
.sub{margin:0;font-weight:700}
.row{display:flex;gap:1em;align-items:stretch;justify-content:center}
.btn{font:inherit;font-weight:800;color:#fff;border:.15em solid #fff;border-radius:2em;padding:.7em 1.2em;cursor:pointer;background:linear-gradient(135deg,var(--pk),#c7a6ff);box-shadow:0 .25em 0 #c46fa3}
.btn.hot{background:linear-gradient(135deg,#ff7aa8,#ff9d5c);box-shadow:0 .25em 0 #c4577e}
.btn small{display:block;font-weight:500;font-size:.7em}
.btn:hover,.btn:focus-visible{transform:translateY(-.1em);outline:.15em solid var(--bl)}
.sm{font:inherit;font-size:.6em;background:none;border:0;color:var(--ink);opacity:.6;cursor:pointer;text-decoration:underline}
.keys{font-size:.8em}
kbd{display:inline-block;min-width:1.6em;padding:.1em .4em;border-radius:.4em;background:#fff;border:.1em solid var(--pk);font:inherit;font-weight:800}
.cert{width:19em;padding:1em;border:.25em double var(--pk);border-radius:1em;background:#fffafd}
.cert h2{margin:0;font-size:.95em}
.rank{font-size:4em;font-weight:900;line-height:1.1;color:var(--pk);text-shadow:.05em .05em 0 var(--bl)}
.cert p{margin:.15em 0}
#rl{margin:0;padding:.7em 1em .7em 2.4em;width:21em;text-align:left;font-size:.7em;background:#ffffffaa;border-radius:1em}
#rl li{padding:.1em 0}#rl .me{font-weight:900;color:#e2368a}
</style></head><body>
<div id="app">
<canvas id="c" width="800" height="600"></canvas>

<section id="title" class="scr on">
 <h1>ゆめかわ★<br>ウイルス・ぽっぷ</h1>
 <p class="sub">〜パステルカラーのサイバー防衛戦！テンキー連打で大優勝★〜</p>
 <p>えっ、ウイルスなのにかわちい！？<br>テンキー叩いてノックアウト★</p>
 <div class="row">
  <button class="btn" data-k="easy">初級：甘口ぽっぷ編<small>ゆったり／2レーン／60秒　[1キー]</small></button>
  <button class="btn hot" data-k="hard">上級：激辛フィーバー編<small>ハイスピード／4レーン／90秒　[2キー]</small></button>
 </div>
 <p class="keys">あそびかた：落ちてくるウイルスが下のラインに重なったら <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd> を叩く！</p>
 <button class="sm" id="rst">ランキングをリセット（スタッフ用）</button>
</section>

<section id="result" class="scr">
 <div class="row">
  <div class="cert">
   <h2>ゆめかわサイバーアナリスト認定証</h2>
   <div class="rank" id="rk"></div>
   <p id="rt" style="font-weight:800"></p>
   <p id="rs"></p>
   <p style="font-size:.7em">📷 スマホで撮影して記念にしてね！</p>
  </div>
  <ol id="rl"></ol>
 </div>
 <div class="row">
  <button class="btn hot" id="again">もう一回！ <small>[Enter]</small></button>
  <button class="btn" id="home">タイトルへ <small>[Esc]</small></button>
 </div>
</section>
</div>

<script>
const $=id=>document.getElementById(id),C=$('c'),X=C.getContext('2d'),W=800,H=600;
const FONT='"Hiragino Maru Gothic ProN","Yu Gothic UI",Meiryo,sans-serif';
const COURSES={
 easy:{name:'甘口ぽっぷ編',lanes:2,fall:2.4,dur:60,bpm:100,p:.6},
 hard:{name:'激辛フィーバー編',lanes:4,fall:1.35,dur:90,bpm:140,p:.55}};
const COLS=['#ff8fc7','#4fd8ff','#9ff2d0','#ffe66b'];
const PEN=[523.25,587.33,659.25,783.99,880],BASS=[130.8,110,87.3,98];
const JUDGE=[{tx:'大優勝！',c:'#ff4fa3',pt:300},{tx:'神！',c:'#3bb8ff',pt:200},{tx:'超かわよ！',c:'#9a6bff',pt:100}];
let S=null,ctx=null,state='title',last='easy',noise=null;

// ---------- chart ----------
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function chart(c){
 const r=rng(c.lanes*77+5),spb=60/c.bpm,step=c.lanes==2?spb:spb/2,lead=Math.ceil((c.fall+.3)/spb)*spb,out=[];
 let prev=-1,rep=0;
 for(let t=lead;t<lead+c.dur-1;t+=step){
  if(r()>=c.p)continue;
  let l=Math.floor(r()*c.lanes);if(l==prev&&rep>=2)l=(l+1)%c.lanes;
  rep=l==prev?rep+1:1;prev=l;
  out.push({t,l,ty:Math.floor(r()*3),h:0});
  if(c.lanes==4&&r()<.12)out.push({t,l:(l+2)%4,ty:Math.floor(r()*3),h:0});
 }
 return{notes:out,lead};
}

// ---------- audio ----------
function tone(f,at,d,type,v){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.value=f;
 g.gain.setValueAtTime(v,at);g.gain.exponentialRampToValueAtTime(.001,at+d);o.connect(g).connect(ctx.destination);o.start(at);o.stop(at+d)}
function kick(at){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(150,at);o.frequency.exponentialRampToValueAtTime(40,at+.15);
 g.gain.setValueAtTime(.5,at);g.gain.exponentialRampToValueAtTime(.001,at+.2);o.connect(g).connect(ctx.destination);o.start(at);o.stop(at+.2)}
function hiss(at,d,v,hp){const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();s.buffer=noise;f.type='highpass';f.frequency.value=hp;
 g.gain.setValueAtTime(v,at);g.gain.exponentialRampToValueAtTime(.001,at+d);s.connect(f).connect(g).connect(ctx.destination);s.start(at);s.stop(at+d)}
function sched(){
 const sp=60/S.c.bpm/4;
 while(S.t0+S.step*sp<ctx.currentTime+.3){
  const i=S.step++,at=S.t0+i*sp,s=i%16,b=(i>>4)%4;
  if(s%4==0)kick(at);
  if(s%4==2)hiss(at,.05,.12,7000);
  if(s==4||s==12)hiss(at,.12,.18,1500);
  if([0,6,8,14].includes(s))tone(BASS[b],at,.25,'triangle',.22);
  if(s%2==0)tone(PEN[((s/2)*3+b*2)%5],at,.18,'square',.035);
 }
}

// ---------- game flow ----------
function show(id){['title','result'].forEach(k=>$(k).classList.toggle('on',k==id))}
function start(k){
 last=k;const c=COURSES[k];
 if(!ctx){ctx=new(window.AudioContext||window.webkitAudioContext)();
  noise=ctx.createBuffer(1,ctx.sampleRate*.3,ctx.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
 ctx.resume();
 const ch=chart(c);
 S={k,c,notes:ch.notes,lead:ch.lead,t0:ctx.currentTime+.3,step:0,hp:10,score:0,combo:0,max:0,hit:0,fx:[],j:null,flash:[0,0,0,0],end:ch.lead+c.dur+.5};
 show(null);state='play';requestAnimationFrame(loop);
}
function loop(){
 if(state!='play')return;
 const t=ctx.currentTime-S.t0;sched();
 for(const n of S.notes)if(!n.h&&t-n.t>.2){n.h=-1;miss()}
 if(S.hp<=0||t>S.end){finish();return}
 draw(t);requestAnimationFrame(loop);
}
function miss(){S.hp--;S.combo=0;S.j={tx:'ざんねん…',c:'#8a7bb0',at:performance.now()}}
function press(l){
 const t=ctx.currentTime-S.t0;S.flash[l]=1;
 let b=null;
 for(const n of S.notes)if(!n.h&&n.l==l){const d=Math.abs(n.t-t);if(d<=.2&&(!b||d<b.d))b={n,d}}
 if(!b)return;
 b.n.h=1;S.hit++;S.combo++;S.max=Math.max(S.max,S.combo);
 const g=b.d<.06?0:b.d<.12?1:2,J=JUDGE[g];
 S.score+=J.pt+Math.min(S.combo,50)*2;S.j={tx:J.tx,c:J.c,at:performance.now()};
 tone(PEN[(l*2)%5]*2,ctx.currentTime,.15,'sine',.25);
 const pos=lanePos(S.c.lanes,l);
 for(let i=0;i<14;i++){const a=Math.random()*6.28,v=2+Math.random()*4;S.fx.push({x:pos,y:500,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,c:COLS[i%4]})}
}
function stop(){state='title';show('title')}
function finish(){
 state='result';
 const total=S.notes.length,rate=total?Math.round(S.hit/total*100):0,dead=S.hp<=0;
 const rk=rate>=95?['S','超大優勝★']:rate>=85?['A','大優勝！']:rate>=70?['B','神！']:['C','まだまだかわいい'];
 $('rk').textContent='ランク '+rk[0];
 $('rt').textContent=(dead?'サーバーダウン… ':'')+'防衛率：'+rate+'%（'+rk[1]+'）';
 $('rs').textContent='スコア '+S.score+'／最大コンボ '+S.max;
 const list=load(),me={s:S.score,d:S.c.name,r:rate,t:new Date().toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}),id:Date.now()};
 list.push(me);list.sort((a,b)=>b.s-a.s);const top=list.slice(0,10);save(top);
 $('rl').innerHTML='';
 top.forEach(e=>{const li=document.createElement('li');if(e.id==me.id)li.className='me';li.textContent=e.s+'点 '+e.d+' '+e.r+'% ('+e.t+')';$('rl').appendChild(li)});
 show('result');
}
function load(){try{return JSON.parse(localStorage.getItem('yumekawa_hs')||'[]')}catch(e){return[]}}
function save(v){try{localStorage.setItem('yumekawa_hs',JSON.stringify(v))}catch(e){}}

// ---------- drawing ----------
function lanePos(n,l){return(W-n*110)/2+l*110+55}
function eyes(x,y,s,w){
 X.fillStyle='#fff';[-1,1].forEach(d=>{X.beginPath();X.arc(x+d*s*.38,y-s*.05,s*.26,0,7);X.fill()});
 X.fillStyle='#5a3a7a';[-1,1].forEach(d=>{X.beginPath();X.arc(x+d*s*.38+w,y,s*.13,0,7);X.fill()});
 X.strokeStyle='#5a3a7a';X.lineWidth=2;X.beginPath();X.arc(x,y+s*.3,s*.14,.1,Math.PI-.1);X.stroke();
}
function blob(x,y,r,col){X.fillStyle=col;X.strokeStyle='#fff';X.lineWidth=3;X.beginPath();X.arc(x,y,r,0,7);X.fill();X.stroke()}
function virus(ty,x,y,t){
 const w=Math.sin(t*5)*1.5;
 if(ty==0){ // ぷにぷにランサムちゃん
  X.fillStyle='#ff6fb5';
  for(let i=0;i<10;i++){const a=i*Math.PI/5+t;X.beginPath();X.moveTo(x+Math.cos(a-.2)*24,y+Math.sin(a-.2)*24);X.lineTo(x+Math.cos(a)*38,y+Math.sin(a)*38);X.lineTo(x+Math.cos(a+.2)*24,y+Math.sin(a+.2)*24);X.fill()}
  blob(x,y,28,'#ffa6d3');eyes(x,y,28,w);
 }else if(ty==1){ // てくてくフィッシング
  blob(x,y+4,26,'#9ff2d0');
  X.fillStyle='#5fd1a8';X.beginPath();X.moveTo(x-20,y-14);X.lineTo(x,y-50);X.lineTo(x+20,y-14);X.fill();
  X.strokeStyle='#5a3a7a';X.lineWidth=3;X.beginPath();X.moveTo(x,y-50);X.lineTo(x,y-64);X.arc(x-6,y-64,6,0,Math.PI*1.1,true);X.stroke();
  eyes(x,y+4,26,w);
 }else{ // パニックDDoS
  [[-16,-10,15],[16,-6,14],[0,16,16]].forEach((p,i)=>{const px=x+p[0]+Math.sin(t*6+i)*3,py=y+p[1]+Math.cos(t*5+i)*3;blob(px,py,p[2],'#ffe66b');eyes(px,py,p[2]*.9,w)});
 }
}
function draw(t){
 const c=S.c,n=c.lanes,hy=500,now=performance.now();
 const g=X.createLinearGradient(0,0,0,H);g.addColorStop(0,'#ffd1ec');g.addColorStop(.55,'#d9c8ff');g.addColorStop(1,'#a9ecff');
 X.fillStyle=g;X.fillRect(0,0,W,H);
 X.fillStyle='rgba(255,255,255,.7)';
 for(let i=0;i<24;i++){X.beginPath();X.arc((i*97)%W,(i*53+t*30*(1+i%3)+H)%H,2+i%3,0,7);X.fill()}
 for(let l=0;l<n;l++){
  const x=lanePos(n,l);
  X.fillStyle='rgba(255,255,255,.45)';X.fillRect(x-55,0,110,H);
  X.strokeStyle='rgba(255,255,255,.9)';X.lineWidth=2;X.strokeRect(x-55,0,110,H);
  S.flash[l]=Math.max(0,S.flash[l]-.08);
  X.fillStyle=COLS[l];X.globalAlpha=.35+S.flash[l]*.65;X.beginPath();X.arc(x,hy,40,0,7);X.fill();X.globalAlpha=1;
  X.strokeStyle='#fff';X.lineWidth=5;X.beginPath();X.arc(x,hy,40,0,7);X.stroke();
  X.fillStyle='#5a3a7a';X.font='bold 28px '+FONT;X.textAlign='center';X.fillText(l+1,x,hy+10);
 }
 for(const nt of S.notes){
  if(nt.h)continue;
  const y=hy-(nt.t-t)/c.fall*(hy+30);
  if(y>-60&&y<H+60)virus(nt.ty,lanePos(n,nt.l),y,t);
 }
 S.fx=S.fx.filter(p=>p.life>0);
 for(const p of S.fx){p.x+=p.vx;p.y+=p.vy;p.life-=.04;X.globalAlpha=Math.max(0,p.life);X.fillStyle=p.c;X.beginPath();X.arc(p.x,p.y,5*p.life+1,0,7);X.fill()}
 X.globalAlpha=1;
 // HUD
 X.textAlign='left';X.font='bold 26px '+FONT;X.lineWidth=5;X.strokeStyle='#fff';
 X.strokeText('SCORE '+S.score,16,36);X.fillStyle='#5a3a7a';X.fillText('SCORE '+S.score,16,36);
 X.font='bold 14px '+FONT;X.fillStyle='#5a3a7a';X.textAlign='right';X.fillText('サーバーHP',W-16,20);
 X.font='20px '+FONT;
 for(let i=0;i<10;i++){X.fillStyle=i<S.hp?'#ff4fa3':'rgba(255,255,255,.7)';X.fillText('♥',W-16-(9-i)*22,44)}
 const pr=Math.min(1,Math.max(0,(t-S.lead)/c.dur));
 X.fillStyle='rgba(255,255,255,.7)';X.fillRect(16,56,220,8);X.fillStyle='#4fd8ff';X.fillRect(16,56,220*pr,8);
 X.textAlign='center';
 if(t<S.lead-.5){X.font='bold 30px '+FONT;X.strokeText('じゅんびしてね…',W/2,300);X.fillStyle='#5a3a7a';X.fillText('じゅんびしてね…',W/2,300)}
 if(S.combo>1){X.font='bold 24px '+FONT;X.strokeText(S.combo+' COMBO',W/2,200);X.fillStyle='#ff4fa3';X.fillText(S.combo+' COMBO',W/2,200)}
 if(S.j&&now-S.j.at<600){
  const a=1-(now-S.j.at)/600;X.globalAlpha=a;X.font='bold 44px '+FONT;
  X.strokeText(S.j.tx,W/2,290-(1-a)*20);X.fillStyle=S.j.c;X.fillText(S.j.tx,W/2,290-(1-a)*20);X.globalAlpha=1;
 }
}

// ---------- input ----------
addEventListener('keydown',e=>{
 if(e.repeat)return;
 const m=/^(?:Numpad|Digit)([1-4])$/.exec(e.code),k=m?+m[1]:0;
 if(state=='title'){if(k==1)start('easy');if(k==2)start('hard')}
 else if(state=='play'){if(e.code=='Escape')stop();else if(k&&k<=S.c.lanes)press(k-1)}
 else{if(e.code=='Enter')start(last);if(e.code=='Escape')stop()}
});
document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>start(b.dataset.k));
$('again').onclick=()=>start(last);$('home').onclick=stop;
$('rst').onclick=()=>{if(confirm('ハイスコアを全部消します。よろしいですか？'))save([])};
</script>
</body></html>
