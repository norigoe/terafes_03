<!DOCTYPE html>
<!--
  ============================================================
  ゆめかわ★ウイルス・ぽっぷ　画面（index.html・松井）
  ------------------------------------------------------------
  ・4つの画面（タイトル／セレクト／プレイ／リザルト）の入れ物。表示するのは1つだけ（class="on" の画面）。画面の切り替えは screens.js。
  ・画面の id は仕様書 10.3 のとおり。担当ごとのファイルは仕様書 2.2 を参照。
  ・中身が空の入れ物（曲カード、プレイ画面のレーン・スコアなど、リザルト画面の認定証の値・ランキングなど）は、
    JavaScript（screens.js、中山さんの view.js / game.js）が画面を出すときに作る。
  ・キャラ（ウイルス3体）は全画面で同じ形。HTMLの形と見た目は chara.css を参照。
  ============================================================
-->
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ゆめかわ★ウイルス・ぽっぷ</title>
<link rel="stylesheet" href="chara.css">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="result.css">
</head><body>

<!-- #app（外枠）の中に #stage（舞台 1067×600）があり、その中に4つの画面が重なっている -->
<div id="app"><div id="stage">

<!-- 背景に浮かぶハート・星（全画面共通。個々の要素は screens.js が作る）。飾りなので、読み上げない（aria-hidden） -->
<div id="fl" aria-hidden="true"></div>

<!-- タイトル画面：最初に表示される。Enter／あそぶボタンでセレクト画面へ -->
<section id="title" class="scr on">
 <!-- ページの見出し（読み上げ用）。タイトルは絵に描かれているので、画面には出さない（見えない大きさにして、はみ出した所を切る） -->
 <h1 style="position:absolute;width:1px;height:1px;margin:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap">ゆめかわ★ウイルス・ぽっぷ</h1>
 <!-- 背景は1枚の絵（images/title.png）。タイトル・キャラ3体・名前とセリフ・「あそぶ」ボタン・「クリック／Enterでスタート」は、絵に描かれている（仕様書 3.2） -->
 <!-- スタッフ用：右上の隅に小さく（パスワードつき。仕様書 3.2） -->
 <button class="sm" id="rst">ランキングをリセット</button>
 <!-- 絵のボタンの上に重ねる、透明な「あそぶ」ボタン。文字は見えないが、読み上げ用に残す -->
 <button id="go"><b>あそぶ</b><small>Enter</small></button>
 <!-- 本日のトップ3：絵の下の白いパネルに重ねる。曲ごとに上位3人（難易度順）。中身は screens.js の renderToday が作る（仕様書 3.2、8.3） -->
 <div id="today">
  <h3>★ 本日のトップ3 ★</h3>
  <div class="tr"></div>
 </div>
</section>

<!-- 曲選択画面：曲カード（#cards）とキー案内（.hint）の中身は、screens.js の buildCards が SONGS から作る（仕様書 3.3） -->
<section id="select" class="scr">
 <!-- タイトルへ戻るボタン：おうちのマークだけの小さな丸いボタン（左上の隅）。aria-label は読み上げ用の名前（画面には出ない）。乗せたときのチップ（title）は、雰囲気に合わないので付けない -->
 <button class="back" id="sback" aria-label="タイトルへ"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 3 2 11.5h3V21h5.5v-6h3v6H19v-9.5h3z" fill="currentColor"/></svg></button>
 <h2 class="hd">きょくをえらんでね</h2>
 <div id="cards"></div>
 <div class="tip">上から落ちてくるウイルスが、下のラインに重なった瞬間にキーを叩いて撃退！<br>見逃すとサーバーHP（ハート）が減るよ。0になったらサーバーダウン…！</div>
 <p class="hint"></p>
</section>

<!-- プレイ画面：レーンとウイルス（#lanes, #field）と、スコアなどの表示（#hud）。中身は中山さんの view.js / game.js が作る（仕様書 3.4） -->
<div id="play" class="scr">
 <div id="lanes"></div>
 <div id="field"></div>
 <div id="hud">
  <div class="hp1" id="hl">
   <div id="sn"></div>
   <div class="lb">SCORE</div><div id="sc"></div>
   <div id="cb"></div>
  </div>
  <div class="hp1" id="hr">
   <div id="hpl">サーバーHP</div>
   <div id="hp"></div>
   <div id="tm"></div>
   <div id="bar"><i id="bi"></i></div>
  </div>
  <div id="jd"></div>
  <div id="rd"></div>
  <div class="esc">Space：スタート　Esc：やめる</div>
 </div>
</div>

<!-- リザルト画面：左に認定証（.cert）と豆知識（#tip）、右にランキング（#rl）。見た目は result.css -->
<section id="result" class="scr">
 <!-- タイトルへ戻るボタン（セレクト画面と同じ、おうちのマーク） -->
 <button class="back" id="rback" aria-label="タイトルへ"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 3 2 11.5h3V21h5.5v-6h3v6H19v-9.5h3z" fill="currentColor"/></svg></button>
 <div class="rleft">
  <div class="cert"><div class="in">
   <h2>ゆめかわサイバーアナリスト認定証</h2>
   <p id="rn"></p>
   <div class="rank" id="rk"></div>
   <p id="rcm"></p>
   <p id="rt"></p>
   <p id="rs"></p>
   <p id="rm"></p>
   <div class="ft">
    <div class="deco" aria-hidden="true"><div class="slot"><div class="ch"><i class="stars"></i><div class="fc c0"><i class="lk"></i><i class="e"></i><i class="e r"></i><i class="bl"></i><i class="bl r"></i><i class="m"></i></div></div></div><div class="slot"><div class="ch"><div class="fc c1"><i class="hk"></i><i class="cr"></i><i class="br"></i><i class="e"></i><i class="e r"></i><i class="bl"></i><i class="bl r"></i><i class="m"></i></div></div></div><div class="slot"><div class="ch"><div class="fc c2"><i class="an"></i><i class="an r"></i><i class="xx">&gt;_&lt;</i><i class="bl"></i><i class="bl r"></i></div></div></div></div>
    <div class="stamp">認定</div>
   </div>
   <p id="rday"></p>
  </div></div>
  <!-- 【できれば】豆知識：tips.js の TIPS から1つを選んで表示する（仕様書 3.5、8.4） -->
  <div id="tip"><h3>💡 セキュリティ豆知識</h3><p id="tipt"></p></div>
 </div>
 <div class="rside">
  <h2 id="rh"></h2>
  <div class="rlbox">
   <h3>この曲のランキング</h3>
   <!-- ランキングの見出し：列はランキングの行（#rl li）とそろえる。見た目は result.css（岡野）。#rl の中に入れると screens.js が書き直すたびに消えるので、外に置く -->
   <div id="rlh"><span>順位</span><span>なまえ</span><span>スコア</span><span>防衛率</span></div>
   <ol id="rl"></ol>
   <!-- 【できれば】名前の入力：10位以内に入ったときだけ表示する（仕様書 3.5） -->
   <p id="nmh">ランクイン！ なまえを入れて Enter（6文字まで）<br>そのまま Enter で「ななし」になるよ</p>
  </div>
  <div class="row">
   <button class="btn hot" id="again">もういちどあそぶ <small>[Enter]</small></button>
   <button class="btn" id="home">きょくをえらぶ <small>[Esc]</small></button>
  </div>
  <p class="snap">スマホで撮って記念にしてね📷</p>
 </div>
</section>

</div></div>

<!-- JavaScript：読み込む順番は仕様書 2.2 のとおり（screens.js が最後） -->
<script src="charts.js"></script>
<script src="ranking.js"></script>
<script src="tips.js"></script>
<script src="audio.js"></script>
<script src="view.js"></script>
<script src="game.js"></script>
<script src="screens.js"></script>
</body></html>
